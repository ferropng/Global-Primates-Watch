[theme]
primaryColor = "#1f77b4"
backgroundColor = "#1f1f1f"
secondaryBackgroundColor = "#2b2b2b"
textColor = "#f5f5f5"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
